name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem build viewing_as.gemspec
      - run: gem push --host https://rubygems.pkg.github.com/${{ github.repository_owner }} viewing_as-*.gem
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
